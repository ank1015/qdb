[package]
name = "qdb"
version = "0.1.0"
edition = "2021"
description = "A from-scratch database engine for text files in folders, queried with bash commands"
license = "MIT"

[lib]
name = "qdb"
path = "src/lib.rs"

[[bin]]
name = "qdb"
path = "src/main.rs"

[[bin]]
name = "qdb-harness"
path = "src/bin/harness.rs"

[[bin]]
name = "qdb-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "qdb-stress"
path = "src/bin/stress.rs"

[[bin]]
name = "qdb-server"
path = "src/bin/server.rs"

[[bin]]
name = "qdb-replay"
path = "src/bin/replay.rs"

[dependencies]
memchr = "2"
# System calls (mmap, flock) and a checksum: the two things the storage
# layer does not write itself.
libc = "0.2"
crc32fast = "1"
# The one compression codec: LZ4 blocks, one piece at a time, with --compress.
# rg's pattern syntax and Unicode tables. Only the parser and its
# translation to byte classes are used; the matching is the engine's own.
regex-syntax = "0.8"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }

[profile.release]
opt-level = 3
debug = false
